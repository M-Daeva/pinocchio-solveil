[workspace.package]
edition = "2021"
repository = ""
authors = ["M. Daeva <embedmad@gmail.com>"]
license = "BSL-1.1"

[workspace]
members = ["programs/*", "packages/*", "tests"]
exclude = []
resolver = "2"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = "fat"
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[workspace.dependencies]
pinocchio = "0.9.0"
pinocchio-pubkey = "0.3.0"
pinocchio-associated-token-account = "0.2.0"
pinocchio-log = "0.5.0"
pinocchio-system = "0.3.0"
pinocchio-token = "0.4.0"

# testing
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = "2.0.106"
serde_json = "1.0.141"
strum = "0.24.1"
strum_macros = "0.24.3"
pretty_assertions = "1.4.1"
litesvm = "0.6.1"
solana-account = "2.2.1"
solana-instruction = "2.2.1"
solana-keypair = "2.2.1"
solana-message = "2.2.1"
solana-pubkey = "2.2.1"
solana-signer = "2.2.1"
solana-transaction = "2.2.1"
solana-system-program = "2.2.1"
solana-program = "2.2.1"
solana-compute-budget = "2.2.1"
spl-associated-token-account = "7.0.0"
spl-token = "8.0.0"
solana-kite = "0.1.4"
bytemuck = { version = "1.23.2", features = ["derive"] }

macro-account = { path = "./packages/macro-account" }
macro-zc-serde = { path = "./packages/macro-zc-serde" }
macro-test-ser = { path = "./packages/macro-test-ser" }
macro-try-from = { path = "./packages/macro-try-from" }
macro-error = { path = "./packages/macro-error" }
base = { path = "./packages/base" }
registry-cpi = { path = "./packages/registry-cpi" }

registry = { path = "./programs/registry" }
