[package]
name = "macro-enum-wrapper"
version = "1.0.0"
description = "Macro to generate struct wrapper for an enum that can be used with bytemuck"
repository = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
proc-macro = true

[features]
default = []
std = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
